<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUHK Startup Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e5e3de;
      --accent: #ff6600;
      --accent-hover: #e55a00;
      --tag-bg: #f0eeea;
      --sidebar-w: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      color: var(--text);
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }
    .hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 24px 32px;
      text-align: center;
    }
    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .hero p {
      color: var(--muted);
      font-size: 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      gap: 28px;
    }
    .sidebar {
      position: sticky;
      top: 72px;
      align-self: start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }
    .filter-group {
      margin-bottom: 20px;
    }
    .filter-group h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
    }
    .filter-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .filter-item span.count {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      background: var(--tag-bg);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .main {
      min-width: 0;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--card);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 18px;
      height: 18px;
    }
    .sort-select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--card);
      cursor: pointer;
    }
    .result-count {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .company-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .company-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 16px;
      transition: box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .company-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border-color: #d0cec8;
    }
    .company-logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff8c42, #ff6600);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .company-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .company-info h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .company-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .company-desc {
      font-size: 14px;
      color: #333;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .company-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tag-bg);
      color: #444;
      white-space: nowrap;
    }
    .tag.category {
      background: #fff0e6;
      color: #c44d00;
    }
    .tag.area {
      background: #e8f0fe;
      color: #1a56db;
    }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--tag-bg);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
    }
    .modal-close:hover { background: #e0ddd6; }
    .modal h2 {
      font-size: 22px;
      margin-bottom: 4px;
      padding-right: 40px;
    }
    .modal .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .modal section {
      margin-bottom: 16px;
    }
    .modal section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal section p {
      font-size: 14px;
      white-space: pre-wrap;
    }
    .modal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .modal-links a.secondary {
      background: var(--tag-bg);
      color: var(--text);
    }
    .modal-links a:hover { opacity: 0.9; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
        max-height: none;
      }
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>

ch", "#Automation"], "email": "", "phone": "", "website": "", "logo": ""}, {"name": "Happy Ageing Lab Limited", "category": "S-KPF", "founder": "MO Kar Him", "nature": "Age-friendly Living Environment", "one_liner": "Offering consultancy services on built environments to promote healthy ageing.", "problem": "\"• Hong Kong’s population is ageing rapidly, with those aged 65 or above projected to increase from one‑fifth of the population in 2021 to one‑third by 2046. • \"\"Housing\"\" and \"\"Community and Healthcare\"\" remain Hong Kong’s weakest areas of support, threatening elderly well-being. • Limited participation platforms lead to design assumptions that neglect older adults' actual needs. • A dedicated interdisciplinary agency must connect professionals with seniors to drive inclusive, empathetic design.\"", "solution": "\"• Understand: Gathers silver market insights through community interviews, workshops, and focus groups regarding older adults' needs. • Assess: Employs trained older adults to conduct user-oriented audits and post-occupancy evaluations on existing places and services. • Develop: Co-creates integrated solutions, strategies, and inclusive design principles alongside docents and built environment practitioners.\"", "users": "older adults, property managers, built environment developers", "impact": "promoting a supportive, inclusive, and attractive living environment for healthy ageing.", "status": "Prototype Testing and Exhibition Day held in March 2025", "path": "consultancy services, collaborative initiatives (e.g., City One Shatin)", "areas": ["Other Areas", "Innovative Biomedicine"], "tags": ["#HealthyAgeing", "#BuiltEnvironment", "#AgeFriendlyDesign", "#Consultancy"], "email": "happyageinglab@cuhk.edu.hk", "phone": "3943 6582", "website": "https://www.happyageinglab.com/", "logo": "https://gocuhk-my.sharepoint.com/:f:/g/personal/janiechan_cuhk_edu_hk/EiFIXcV56GxAoxOr3YuaWtMButXrlnhT2jeuk4zapCHZcg?e=UmE25O"}, {"name": "Hawkeyes Solutions Lim     const categoryFilters = document.getElementById('category-filters');
    const areaFilters = document.getElementById('area-filters');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const listEl = document.getElementById('company-list');
    const countEl = document.getElementById('result-count');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const modalClose = document.getElementById('modal-close');

    // Build filters
    const catCounts = {};
    const areaCounts = {};
    companies.forEach(c => {
      catCounts[c.category] = (catCounts[c.category] || 0) + 1;
      c.areas.forEach(a => { areaCounts[a] = (areaCounts[a] || 0) + 1; });
    });

    const sortedCats = Object.keys(catCounts).sort((a,b) => catCounts[b]-catCounts[a]);
    const sortedAreas = Object.keys(areaCounts).sort((a,b) => areaCounts[b]-areaCounts[a]);

    sortedCats.forEach(cat => {
      const label = document.createElement('label');
      label.className = 'filter-item';
      label.innerHTML = `<input type="checkbox" value="${cat}" data-type="category"> ${cat} <span class="count">${catCounts[cat]}</span>`;
      categoryFilters.appendChild(label);
    });
    sortedAreas.forEach(area => {
      const label = document.createElement('label');
      label.className = 'filter-item';
      label.innerHTML = `<input type="checkbox" value="${area}" data-type="area"> ${area} <span class="count">${areaCounts[area]}</span>`;
      areaFilters.appendChild(label);
    });

    function getSelected(type) {
      return Array.from(document.querySelectorAll(`input[data-type="${type}"]:checked`)).map(i => i.value);
    }

    function getInitial(name) {
      const words = name.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, ' ').trim().split(/\s+/);
      return (words[0] || '?')[0].toUpperCase();
    }

    function renderList() {
      const q = searchInput.value.toLowerCase().trim();
      const selectedCats = getSelected('category');
      const selectedAreas = getSelected('area');
      const sortBy = sortSelect.value;

      let filtered = companies.filter(c => {
        if (selectedCats.length && !selectedCats.includes(c.category)) return false;
        if (selectedAreas.length && !c.areas.some(a => selectedAreas.includes(a))) return false;
        if (q) {
          const hay = [c.name, c.one_liner, c.founder, c.nature, c.tags.join(' '), c.areas.join(' ')].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (sortBy === 'name') {
        filtered.sort((a,b) => a.name.localeCompare(b.name));
      } else {
        filtered.sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
      }

      countEl.textContent = `顯示 ${filtered.length} / ${companies.length} 間公司`;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">沒有符合條件的公司</div>';
        return;
      }

      listEl.innerHTML = filtered.map((c, i) => {
        const logoHtml = c.logo && c.logo.startsWith('http')
          ? `<img src="${c.logo}" alt="" onerror="this.parentElement.innerHTML='${getInitial(c.name)}'">`
          : getInitial(c.name);
        const tagsHtml = [
          `<span class="tag category">${c.category}</span>`,
          ...c.areas.slice(0,2).map(a => `<span class="tag area">${a}</span>`),
          ...c.tags.slice(0,3).map(t => `<span class="tag">${t.replace(/^#/,'')}</span>`)
        ].join('');
        return `
          <div class="company-card" data-idx="${companies.indexOf(c)}">
            <div class="company-logo">${logoHtml}</div>
            <div class="company-info">
              <h2>${escapeHtml(c.name)}</h2>
              <div class="company-meta">${escapeHtml(c.founder)}${c.nature ? ' · ' + escapeHtml(c.nature) : ''}</div>
              <div class="company-desc">${escapeHtml(c.one_liner)}</div>
              <div class="company-tags">${tagsHtml}</div>
            </div>
          </div>`;
      }).join('');

      listEl.querySelectorAll('.company-card').forEach(card => {
        card.addEventListener('click', () => openModal(+card.dataset.idx));
      });
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function openModal(idx) {
      const c = companies[idx];
      let sections = '';
      if (c.problem) sections += `<section><h3>Problem</h3><p>${escapeHtml(c.problem)}</p></section>`;
      if (c.solution) sections += `<section><h3>Solution</h3><p>${escapeHtml(c.solution)}</p></section>`;
      if (c.users) sections += `<section><h3>Target Users</h3><p>${escapeHtml(c.users)}</p></section>`;
      if (c.impact) sections += `<section><h3>Impact</h3><p>${escapeHtml(c.impact)}</p></section>`;
      if (c.status) sections += `<section><h3>Development Status</h3><p>${escapeHtml(c.status)}</p></section>`;
      if (c.path) sections += `<section><h3>Path to Market</h3><p>${escapeHtml(c.path)}</p></section>`;

      let links = '';
      if (c.website) links += `<a href="${c.website}" target="_blank" rel="noopener">Website</a>`;
      if (c.email) links += `<a class="secondary" href="mailto:${c.email}">Email</a>`;
      if (c.phone) links += `<a class="secondary" href="tel:${c.phone.replace(/\s/g,'')}">${escapeHtml(c.phone)}</a>`;

      modalContent.innerHTML = `
        <h2>${escapeHtml(c.name)}</h2>
        <div class="meta">${escapeHtml(c.founder)}${c.nature ? ' · ' + escapeHtml(c.nature) : ''} · ${escapeHtml(c.category)}</div>
        <p style="font-size:15px;margin-bottom:16px">${escapeHtml(c.one_liner)}</p>
        ${sections}
        <div class="company-tags" style="margin-bottom:12px">${c.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="modal-links">${links}</div>
      `;
      modalOverlay.classList.add('open');
    }

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modalOverlay.classList.remove('open'); });

    searchInput.addEventListener('input', renderList);
    sortSelect.addEventListener('change', renderList);
    document.querySelectorAll('input[data-type]').forEach(cb => cb.addEventListener('change', renderList));

    renderList();
  </script>
</body>
